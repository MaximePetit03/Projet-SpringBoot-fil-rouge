spring.application.name=Projet-fil-rouge

server.port=8082
# --- Configuration H2 ---
# URL de la base de données en mémoire
spring.datasource.url=jdbc:h2:mem:formationdb
# Driver JDBC
spring.datasource.driver-class-name=org.h2.Driver
# Identifiants
spring.datasource.username=sa
spring.datasource.password=
# --- Console H2 (accessible via navigateur) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# --- JPA / Hibernate ---
# Créer les tables automatiquement à partir des entités
spring.jpa.hibernate.ddl-auto=create-drop
# Afficher les requêtes SQL dans la console (utile en développement)
spring.jpa.show-sql=true
# Formater les requêtes SQL pour la lisibilité
spring.jpa.properties.hibernate.format_sql=true
# Remarque : Hibernate 7 détecte automatiquement le dialecte H2, inutile de le préciser
spring.jpa.defer-datasource-initialization=true
